<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OGVirk Live</title>
    <meta name="description" content="OGVirk Live Official App & Hub" />
    <meta property="og:title" content="OGVirk Live" />
    <meta property="og:description" content="OGVirk Live Official App & Hub" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FF6B00" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http: wss: ws:; connect-src 'self' https: http: wss: ws: data: blob:; img-src 'self' https: http: data: blob:; media-src 'self' https: http: data: blob:; font-src 'self' https: http: data:;" />
    <meta name="media-playback-requires-user-gesture" content="false" />
    <meta name="autoplay-policy" content="no-user-gesture-required" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    
    <script>
      (function() {
        // Defensive DOM Head Guard: ensure document.head exists before early script evaluation
        if (typeof document !== 'undefined') {
          if (!document.head) {
            var heads = document.getElementsByTagName('head');
            if (heads && heads.length > 0) {
              document.head = heads[0];
            }
          }
        }

        // Global Error Guard & White-Screen Recovery Mechanism
        window.addEventListener('error', function(e) {
          console.warn('[Global Error Handler]', e.message || e);
          // If non-critical appendChild or component registration warning occurs in extension/injected scripts, prevent halting
          if (e && e.message && (
            e.message.indexOf('appendChild') !== -1 ||
            e.message.indexOf('Component auth has not been registered') !== -1
          )) {
            // Mark as handled to avoid breaking application initialization
            e.preventDefault && e.preventDefault();
          }
        });

        // Pre-warm Speech Synthesis and Web Audio API for seamless playback
        window.addEventListener('DOMContentLoaded', function() {
          if ('speechSynthesis' in window) {
            try { window.speechSynthesis.getVoices(); } catch(e) {}
          }
        });
      })();
    </script>
  </head>
  <body style="margin:0; padding:0; background-color:#020617; font-family: 'Montserrat', system-ui, -apple-system, sans-serif;">
    <div id="root">
      <!-- Fallback loader to eliminate blank white screen during app initialization -->
      <div id="initial-app-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020617; color: #ffffff; padding: 24px; text-align: center;">
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 20px;">
          <div style="width: 100%; height: 100%; border: 4px solid rgba(255, 107, 0, 0.15); border-top-color: #FF6B00; border-radius: 50%; animation: ogspin 0.8s linear infinite;"></div>
          <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #FF6B00;">OG</div>
        </div>
        <h2 style="font-size: 18px; font-weight: 900; letter-spacing: 1px; color: #ffffff; margin: 0 0 6px 0;">OGVIRK LIVE</h2>
        <p id="loader-status" style="font-size: 12px; color: #94a3b8; font-weight: 700; margin: 0;">Loading OGVirk Live...</p>
        <style>
          @keyframes ogspin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script>
      // Startup watchdog: if bundle loading encounters delay, avoid getting permanently stuck
      setTimeout(function() {
        var statusEl = document.getElementById('loader-status');
        if (statusEl && document.getElementById('initial-app-loader')) {
          statusEl.textContent = 'Connecting to network...';
        }
      }, 1200);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
